# uv workspace root. The installable client package lives in ./c3 (distribution
# "test-agent-zero", import name "taz"). This root is a virtual project that
# holds the shared dev tooling and the integration test suite in ./tests.
[project]
name = "taz-workspace"
version = "0.0.0"
description = "Workspace root for TAZ (daemon, client, protocol)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# uv.lock does not cover the build backend that builds ./c3, so pin it and its
# dependencies here (bumped by hand with the rest of the pins).
build-constraint-dependencies = [
    "hatch-vcs==0.5.0",
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "setuptools==84.0.0",
    "setuptools-scm==10.3.4",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
    "vcs-versioning==2.5.0",
]

[tool.uv.workspace]
members = ["c3"]

[tool.uv.sources]
test-agent-zero = { workspace = true }

[dependency-groups]
dev = [
    "test-agent-zero",
    "pytest>=9.0.3",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "types-protobuf>=6",
    "cmakelang>=0.6.13",
    "pyyaml>=6",  # cmakelang reads .cmake-format.yaml through PyYAML
    "clang-format>=23,<24",
    "clang-tidy>=22,<23",
    "grpcio-tools>=1.84.0",
    "protobuf>=7",
    "gcovr>=8.6",
    "pytest-cov>=7.1",
    "conan>=2.32.0,<3",
    "psutil>=7.2.2",
    "types-psutil>=7.2.2.20260906",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "c3/tests"]
# importlib mode lets tests/ and c3/tests/ coexist without package name clashes.
addopts = "-ra --import-mode=importlib"
markers = [
    "packaging: tests that build and inspect the wheel (slow; run with -m packaging)",
    "slow: integration tests that require a live daemon or real network",
]

# ---------------------------------------------------------------------------
# coverage (pytest-cov, used by `just coverage`)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = ["*/taz/v1/*"] # generated protobuf modules

# ---------------------------------------------------------------------------
# ruff (formatter + linter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "c3/src/taz/v1",        # generated protobuf code
    "daemon/third_party",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the test idiom; subprocess.Popen in integration tests uses
# known paths from fixtures, not untrusted input.
"tests/**" = ["S101", "S603"]
"c3/tests/**" = ["S101"]
# tools/dev.py exists to run developer tools; its subprocess arguments are
# constants and PATH lookups, never user input.
"tools/**" = ["S603", "S607"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["c3/src", "c3/tests", "tests", "tools"]
exclude = ["c3/src/taz/v1/"]

[[tool.mypy.overrides]]
module = ["taz.v1.*"]
# protoc's generated .pyi stubs use bare `Mapping`; use them for typing our
# code but do not hold generated files to --strict.
follow_imports = "silent"
disallow_any_generics = false
