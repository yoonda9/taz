[project]
name = "tazer"
dynamic = ["version"]
description = "Python client (c3) for the TAZER test-orchestration daemon"
readme = "README.md"
authors = [
    { name = "David Yoon", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "protobuf>=7",
]

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/tazer"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
