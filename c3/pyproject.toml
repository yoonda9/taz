[project]
name = "test-agent-zero"
dynamic = ["version"]
description = "Python client (c3) for Test Agent Zero, the taz remote test daemon"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "David Yoon", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "crc32c>=2.9.post0",
    "protobuf>=7",
]

[project.scripts]
taz = "taz.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/taz"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
