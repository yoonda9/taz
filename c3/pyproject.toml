[project]
name = "tazer"
version = "0.1.0"
description = "Command & Control Client for the TAZER RAT"
readme = "README.md"
authors = [
    { name = "David Yoon", email = "" }
]
requires-python = ">=3.12"
dependencies = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["tazer"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
test = [
    "pytest>=9.0.2",
]
