// TAZER protocol: process management (docs/api.md §3).

syntax = "proto3";

package tazer.v1;

message ProcessInfo {
  uint32 pid = 1;
  string name = 2;
  string user = 3;
  float cpu_percent = 4;
  uint64 memory_bytes = 5;
  // Running, sleeping, stopped, etc.
  string state = 6;
}

// PROCESS_LIST (0x0020)
message ProcessListRequest {
  // Optional process-name substring filter.
  string filter = 1;
}

// May be delivered as several RESPONSE frames with CONTINUATION; receivers
// append `processes` across frames.
message ProcessListResponse {
  repeated ProcessInfo processes = 1;
}

// PROCESS_KILL (0x0021)
message ProcessKillRequest {
  uint32 pid = 1;
  // Signal to send; 0 means the platform's SIGTERM equivalent.
  int32 signal = 2;
}

message ProcessKillResponse {
  bool success = 1;
}

// PROCESS_INFO (0x0022)
message ProcessInfoRequest {
  uint32 pid = 1;
}

message ProcessInfoResponse {
  ProcessInfo info = 1;
  string command_line = 2;
  // Unix timestamp.
  uint64 start_time = 3;
  // Best effort; may be empty.
  repeated string open_files = 4;
}

// PROCESS_MONITOR (0x0023) — streamed RESPONSE frames with CONTINUATION set
// until the process exits or the client sends CANCEL.
message ProcessMonitorRequest {
  uint32 pid = 1;
  uint32 interval_ms = 2;
}

message ProcessMonitorResponse {
  ProcessInfo info = 1;
  bool exited = 2;
  // Best effort: on POSIX only known for processes the daemon spawned.
  int32 exit_code = 3;
  // "" while open, then "exited", "cancelled" or "error" on the final frame.
  string reason = 4;
  // True when `exit_code` is authoritative rather than a placeholder.
  bool exit_code_known = 5;
}
