// TAZER protocol: advanced operations (docs/api.md §5).

syntax = "proto3";

package tazer.v1;

import "tazer/v1/command.proto";
import "tazer/v1/common.proto";
import "tazer/v1/file.proto";

// RUN_AS (0x0040)
message RunAsRequest {
  // Username to assume for subsequent process-spawning operations on this
  // connection. Empty resets to the daemon's own identity.
  string user = 1;
}

message RunAsResponse {
  bool success = 1;
  string effective_user = 2;
}

// TIMEOUT_SET (0x0041)
message TimeoutSetRequest {
  // Default operation timeout for this connection; 0 disables it.
  uint32 timeout_ms = 1;
}

message TimeoutSetResponse {
  uint32 previous_ms = 1;
}

// LOG (0x0042)
message LogRequest {
  uint32 lines = 1;
  // Only entries after this Unix timestamp.
  uint64 since = 2;
  // Minimum level: DEBUG, INFO, WARN, ERROR.
  string level = 3;
}

message LogEntry {
  uint64 timestamp = 1;
  string level = 2;
  string message = 3;
}

// May be delivered as several RESPONSE frames with CONTINUATION; receivers
// append `entries` across frames.
message LogResponse {
  repeated LogEntry entries = 1;
}

// DETACH (0x0043)
message DetachRequest {
  // Field 2 is reserved for the PIPELINE task variant.
  reserved 2;
  reserved "pipeline";

  oneof task {
    CommandExecRequest exec = 1;
    FilePutRequest file_put = 3;
    FileGetRequest file_get = 4;
  }
  // Retain status for later TASK_STATUS polling.
  bool monitor = 5;
  ErrorPriority error_priority = 6;
}

message DetachResponse {
  // Valid for the connection's lifetime.
  uint32 task_id = 1;
  // Underlying OS process id where applicable; 0 otherwise.
  uint32 pid = 2;
}

// TASK_STATUS (0x0044)
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PENDING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_COMPLETED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELLED = 5;
}

message TaskStatusRequest {
  uint32 task_id = 1;
  // Stream updates (CONTINUATION set) until the task ends or CANCEL.
  bool subscribe = 2;
  uint32 interval_ms = 3;
}

message TaskStatusResponse {
  TaskState state = 1;
  uint32 pid = 2;
  uint64 progress = 3;
  // 0 when unknown.
  uint64 progress_total = 4;
  // Serialized response of the underlying operation when COMPLETED.
  bytes result = 5;
  // Present when FAILED.
  ErrorInfo error = 6;
}

// TASK_CANCEL (0x0045)
message TaskCancelRequest {
  uint32 task_id = 1;
  // Signal for tasks with an OS process; ignored otherwise.
  int32 signal = 2;
}

message TaskCancelResponse {
  // Accepted does not mean the task has already stopped.
  bool accepted = 1;
}

// CANCEL (0x0046) — cancels an in-flight streaming operation or transfer.
message CancelRequest {
  uint32 target_stream_id = 1;
}

message CancelResponse {
  // Whether the stream was found and cancelled.
  bool cancelled = 1;
}
