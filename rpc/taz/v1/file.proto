// TAZ protocol: file operations (docs/api.md §4).
//
// FILE_PUT and FILE_GET exchange metadata with these messages; the file bytes
// travel as raw FILE_CHUNK frames sharing the request's stream_id
// (docs/protocol.md §8).

syntax = "proto3";

package taz.v1;

import "taz/v1/common.proto";

// FILE_PUT (0x0030)
message FilePutRequest {
  string dest = 1;
  uint64 size = 2;
  // POSIX mode bits.
  uint32 permissions = 3;
  bool overwrite = 4;
}

// Two RESPONSE frames are sent on the FILE_PUT stream: `ack` before the
// client starts sending FILE_CHUNK frames and `confirm` after the last one.
message FilePutResponse {
  message Ack {
    bool ready = 1;
  }
  message Confirmation {
    uint64 bytes_written = 1;
    // CRC32C of the written file, 4 bytes little-endian.
    bytes checksum = 2;
  }
  oneof phase {
    Ack ack = 1;
    Confirmation confirm = 2;
  }
}

// FILE_GET (0x0031)
message FileGetRequest {
  string src = 1;
}

message FileGetResponse {
  uint64 size = 1;
  uint32 permissions = 2;
  // CRC32C of the file, 4 bytes little-endian.
  bytes checksum = 3;
}

// FILE_CREATE (0x0032)
message FileCreateRequest {
  string path = 1;
  // Optional inline content; must fit in a single REQUEST frame.
  bytes content = 2;
  uint32 permissions = 3;
}

message FileCreateResponse {
  bool success = 1;
}

// FILE_DELETE (0x0033)
message FileDeleteRequest {
  string path = 1;
}

message FileDeleteResponse {
  bool success = 1;
}

// FILE_STAT (0x0034)
message FileStatRequest {
  string path = 1;
}

message FileStatResponse {
  uint64 size = 1;
  uint32 permissions = 2;
  string owner = 3;
  // Unix timestamps.
  uint64 modified = 4;
  uint64 created = 5;
  Kind kind = 6;
  // Target path when kind == KIND_SYMLINK; empty otherwise.
  string link_target = 7;
}

// FILE_CHMOD (0x0035)
message FileChmodRequest {
  string path = 1;
  uint32 permissions = 2;
}

message FileChmodResponse {
  bool success = 1;
}

// DIR_MAKE (0x0036)
message DirMakeRequest {
  string path = 1;
  // POSIX mode bits; 0 means the daemon default (0755).
  uint32 permissions = 2;
  // Create missing parents (mkdir -p).
  bool parents = 3;
}

message DirMakeResponse {
  bool success = 1;
}

// DIR_LIST (0x0037)
message DirListRequest {
  string path = 1;
  bool include_hidden = 2;
}

message DirEntry {
  // Entry name, not a full path.
  string name = 1;
  Kind kind = 2;
  // 0 for non-files.
  uint64 size = 3;
}

// May be delivered as several RESPONSE frames with CONTINUATION; receivers
// append `entries` across frames.
message DirListResponse {
  repeated DirEntry entries = 1;
}

// DIR_REMOVE (0x0038)
message DirRemoveRequest {
  string path = 1;
  bool recursive = 2;
}

message DirRemoveResponse {
  bool success = 1;
}
