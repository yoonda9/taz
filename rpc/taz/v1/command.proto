// TAZ protocol: command execution (docs/api.md §2.1).

syntax = "proto3";

package taz.v1;

import "taz/v1/common.proto";

// COMMAND_EXEC (0x0010)
message CommandExecRequest {
  string command = 1;
  repeated string args = 2;
  // Additional environment variables (map<string, string>).
  repeated KeyValue env = 3;
  // Working directory; empty means the daemon's current directory.
  string working_dir = 4;
  // 0 falls back to the connection default set via TIMEOUT_SET.
  uint32 timeout_ms = 5;
  // Run as this user for this command only; empty uses the connection's
  // current identity (RUN_AS).
  string as_user = 6;
}

// Large outputs may be delivered as several RESPONSE frames with the
// CONTINUATION flag: receivers concatenate `stdout_data`/`stderr_data` across
// frames and read the scalar fields from the final frame.
message CommandExecResponse {
  int32 exit_code = 1;
  // Standard output and standard error. Not named `stdout`/`stderr`: C's
  // <stdio.h> defines those as macros (function calls on MSVC), which would
  // rewrite the fields in generated C code.
  bytes stdout_data = 2;
  bytes stderr_data = 3;
  // The command was killed because it exceeded its timeout.
  bool timed_out = 4;
  // Output exceeded the daemon's `exec.max_output_bytes` limit and was cut.
  bool truncated = 5;
}
