version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  ignore_only:
    # ErrorCode numbering is specified by docs/api.md with UNKNOWN = 0, and
    # FrameFlag uses NONE = 0 because its values are bit masks.
    ENUM_ZERO_VALUE_SUFFIX:
      - taz/v1/common.proto
breaking:
  use:
    - FILE
