# Mirrors .github/workflows/ci.yml: every step is a `just` recipe, and each
# extra check selects one CMake preset from daemon/CMakePresets.json.
stages:
  - verify

variables:
  CI: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0 # hatch-vcs derives the client version from tags
  MISE_YES: "1"
  MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR

.linux:
  stage: verify
  image: ubuntu:24.04
  cache:
    key: conan-$CI_COMMIT_REF_SLUG
    paths:
      - .conan2/p
  variables:
    CONAN_HOME: $CI_PROJECT_DIR/.conan2
    EXTRA_PACKAGES: ""
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git build-essential cppcheck $EXTRA_PACKAGES
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    - mise install
    - just setup

linux:
  extends: .linux
  script:
    - just doctor
    - just build
    - just test
    - just lint
  artifacts:
    paths:
      - daemon/build/linux-debug/tazd
    expire_in: 1 week

linux-asan:
  extends: .linux
  script: [just test-c linux-asan]

linux-tsan:
  extends: .linux
  script: [just test-c linux-tsan]

linux-valgrind:
  extends: .linux
  variables:
    EXTRA_PACKAGES: valgrind
  script: [just test-valgrind]

linux-analyze:
  extends: .linux
  script: [just build linux-analyze]

linux-clang:
  extends: .linux
  variables:
    EXTRA_PACKAGES: clang
  script: [just test-c linux-clang-debug]

linux-coverage:
  extends: .linux
  script: [just coverage]
  artifacts:
    paths:
      - out/coverage
    expire_in: 1 week

# Windows jobs need a runner with Visual Studio Build Tools (C++ workload) and
# mise on PATH. Enabled by setting TAZ_WINDOWS_RUNNER=true in the project's
# CI variables so pipelines without such a runner do not hang.
.windows:
  stage: verify
  tags: [windows, msvc]
  rules:
    - if: $TAZ_WINDOWS_RUNNER == "true"
  before_script:
    - choco install cppcheck --no-progress -y
    - $env:PATH = "C:\Program Files\Cppcheck;$env:PATH"
    - mise install
    - just setup

windows:
  extends: .windows
  script:
    - just doctor
    - just build
    - just test
    - just lint
  artifacts:
    paths:
      - daemon/build/windows-debug/tazd.exe
    expire_in: 1 week

windows-asan:
  extends: .windows
  script: [just test-c windows-asan]

windows-analyze:
  extends: .windows
  script: [just build windows-analyze]
