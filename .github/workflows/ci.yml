name: CI

# Runs on every branch push (checks appear on PRs via the head commit) and on
# demand. No separate pull_request trigger, which would double-run same-repo PRs.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  linux:
    name: Linux (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # hatch-vcs derives the client version from tags

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system tools not managed by mise
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}

      - run: just setup
      - run: just doctor
      - run: just build
      - run: just test
      - run: just lint

      - uses: actions/upload-artifact@v4
        with:
          name: tazer-linux-x64-debug
          path: daemon/build/linux-debug/tazer

  sanitizers:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}

      - run: just setup
      # Same preset a developer runs locally: `just test-c linux-asan`.
      - run: just test-c ${{ matrix.preset }}

  windows:
    name: Windows (build, test, lint)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system tools not managed by mise
        run: |
          choco install cppcheck --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Cppcheck'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}

      # No msvc-dev-cmd step on purpose: `just configure` must find MSVC by
      # itself (tools/dev.py loads vcvarsall via vswhere), exactly as on a
      # developer's machine.
      - run: just setup
      - run: just doctor
      - run: just build
      - run: just test
      - run: just lint

      - uses: actions/upload-artifact@v4
        with:
          name: tazer-windows-x64-debug
          path: daemon/build/windows-debug/tazer.exe

  windows-asan:
    name: Windows windows-asan
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}

      - run: just setup
      # Same preset a developer runs locally: `just test-c windows-asan`.
      - run: just test-c windows-asan
