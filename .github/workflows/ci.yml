name: CI

# Runs on every branch push (checks appear on PRs via the head commit) and on
# demand. No separate pull_request trigger, which would double-run same-repo PRs.
#
# Every check is a `just` recipe, so a red step reproduces locally with the same
# command. Checks that share a toolchain run as steps of one job, because each
# job bills at least a minute in a private repo: every matrix entry lists its
# `checks` (`main` is doctor, build, test and lint), and a check's step runs only
# in the entry that lists it. To give a check its own job, move it to a new entry.
#
# Every version here is exact and bumped by hand ("Pinned versions" in
# AGENTS.md): actions by commit SHA, mise by release, tools via mise.toml.
#
# The `release` check builds the static release preset (musl on Linux, /MT on
# Windows), runs the full test suite against that binary, verifies it is
# fully static and uploads it as a workflow artifact on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch's running CI; every commit on main keeps
  # its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "1"
  # Fail instead of re-resolving when uv.lock is out of date with pyproject.toml.
  UV_LOCKED: "1"
  # mise itself, for both jobs' mise-action (the tools are pinned in mise.toml).
  MISE_VERSION: 2026.9.14

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux gcc (build, test, lint, sanitizers, valgrind, analyze, coverage)
            checks: [main, asan, tsan, valgrind, analyze, coverage]
            packages: valgrind
            conan-preset: linux-debug
          - name: Linux clang (build, test, fuzz)
            checks: [clang, fuzz]
            # libclang-rt-dev carries the libFuzzer and sanitizer runtimes,
            # which `clang` alone does not pull in.
            packages: clang libclang-rt-dev
            conan-preset: linux-clang-debug
            mise-tools: uv just prek cmake ninja
          - name: Linux release (musl static tazd)
            checks: [release]
            conan-preset: linux-musl-release
            musl-arch: x86_64
            mise-tools: uv just prek cmake ninja
            # linux-musl-release has its own Conan home (own package set,
            # never shared with the glibc presets' ~/.conan2), under
            # TAZ_CACHE_DIR.
            conan-cache-path: ~/.cache/taz/conan-musl/p
          - name: Linux i686 (musl static tazd)
            checks: [release]
            conan-preset: linux-musl-i686-release
            musl-arch: i686
            mise-tools: uv just prek cmake ninja
            # Own Conan home, same rationale as linux-musl-release, keyed by
            # arch (tools/dev.py conan_env) so the i686 packages never
            # collide with the x86_64 musl ones.
            conan-cache-path: ~/.cache/taz/conan-musl-i686/p
    env:
      # Every preset an entry builds must need the same Conan packages as this
      # one; `just deps` enforces it (see the Conan cache steps).
      TAZ_CI_CONAN_PRESET: ${{ matrix.conan-preset }}
      # tools/dev.py's cache root (musl toolchain, musl Conan home), set so it
      # always matches the paths the cache steps save.
      TAZ_CACHE_DIR: ~/.cache/taz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # hatch-vcs derives the client version from tags
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          # Entries without `main` skip the lint-only tools (node, prettier, buf,
          # cppcheck).
          install_args: ${{ matrix.mise-tools }}

      - name: Install system tools not managed by mise
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - run: just setup

      - if: contains(matrix.checks, 'main')
        run: just doctor

      # The musl toolchain must be on disk before `just deps` runs (the
      # linux-musl profile's compiler_executables point into it); its own
      # cache, keyed on the pinned tarball hash, needs no network on a hit.
      # Saved right after the fetch, so a red job never downloads it again.
      - name: Toolchain cache key
        id: toolchain-key
        if: contains(matrix.checks, 'release')
        run: |
          key=$(uv run python tools/dev.py musl-toolchain --print-key ${{ matrix.musl-arch }})
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore musl toolchain
        id: toolchain-cache
        if: contains(matrix.checks, 'release')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/taz/toolchains
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Fetch musl toolchain
        if: contains(matrix.checks, 'release')
        run: just musl-toolchain ${{ matrix.musl-arch }}

      - name: Save musl toolchain
        if: contains(matrix.checks, 'release') && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/taz/toolchains
          key: ${{ steps.toolchain-key.outputs.key }}

      # The Conan package cache is restored only on an exact key match: the key
      # digests every input that decides the package binaries, and package ids
      # alone do not (tools/dev.py conan-cache-key).
      - name: Conan cache key
        id: conan-key
        run: |
          key=$(uv run python tools/dev.py conan-cache-key ${{ matrix.conan-preset }})
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.conan-cache-path || '~/.conan2/p' }}
          key: ${{ steps.conan-key.outputs.key }}

      - id: deps
        run: just deps ${{ matrix.conan-preset }}

      - name: Trim Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: uv run python tools/dev.py conan-cache-trim ${{ matrix.conan-preset }}

      - name: Save Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.conan-cache-path || '~/.conan2/p' }}
          key: ${{ steps.conan-key.outputs.key }}

      - if: contains(matrix.checks, 'main')
        run: just build
      - if: contains(matrix.checks, 'main')
        env:
          TAZ_DAEMON: daemon/build/linux-debug/tazd
        run: just test
      - if: contains(matrix.checks, 'main')
        run: just lint

      - if: contains(matrix.checks, 'main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taz-linux-x64-debug
          path: daemon/build/linux-debug/tazd

      # The other checks run even after an earlier step failed, as long as the
      # dependencies installed, so one red check never hides another.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'asan') }}
        run: just test-c linux-asan
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'asan') }}
        env:
          TAZ_DAEMON: daemon/build/linux-asan/tazd
        run: just test-py

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'tsan') }}
        run: just test-c linux-tsan

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'valgrind') }}
        run: just test-valgrind

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'valgrind') }}
        run: just test-py-valgrind

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'analyze') }}
        run: just build linux-analyze

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'clang') }}
        run: just test-c linux-clang-debug

      # linux-fuzz shares linux-clang-debug's Conan packages (clang profile,
      # Debug), so it can run in this entry.
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'fuzz') }}
        run: just fuzz

      - id: coverage
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'coverage') }}
        env:
          TAZ_DAEMON: daemon/build/linux-debug/tazd
        run: just coverage

      - if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: out/coverage

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just build ${{ matrix.conan-preset }}

      - id: release-test-c
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just test-c ${{ matrix.conan-preset }}

      - id: release-test-py
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just test-py --daemon daemon/build/${{ matrix.conan-preset }}/tazd

      - id: release-verify
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just verify-static ${{ matrix.conan-preset }}

      # Only a binary that passed every check above is published. i686's
      # bundle/artifact upload is a separate task (C3c); this entry only
      # proves the preset builds, tests and is fully static in CI.
      - id: release-bundle
        if: ${{ !cancelled() && steps.release-test-c.outcome == 'success' && steps.release-test-py.outcome == 'success' && steps.release-verify.outcome == 'success' && matrix.conan-preset == 'linux-musl-release' }}
        run: just release-bundle linux-musl-release

      - if: ${{ !cancelled() && steps.release-bundle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taz-linux-x64
          path: out/release/taz-linux-x64

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (build, test, lint)
            checks: [main]
            conan-preset: windows-debug
          - name: Windows (asan, analyze)
            checks: [asan, analyze]
            conan-preset: windows-asan
            mise-tools: uv just prek cmake ninja
          - name: Windows release (static tazd.exe)
            checks: [release]
            conan-preset: windows-release
            mise-tools: uv just prek cmake ninja
    env:
      TAZ_CI_CONAN_PRESET: ${{ matrix.conan-preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ matrix.mise-tools }}

      # mise installs cppcheck on Linux only (conda-forge's Windows build cannot
      # find its cfg files), so Windows takes the official MSI, checksum-
      # verified. CPPCHECK_VERSION must equal the pin in mise.toml; `just
      # doctor` fails otherwise.
      - name: Install cppcheck
        if: contains(matrix.checks, 'main')
        env:
          CPPCHECK_VERSION: 2.22.0
          CPPCHECK_SHA256: 3929162bab7e71d1b9b18708ec054fb0188bfc8ea1660979ed95837f5a9f547b
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "cppcheck-$env:CPPCHECK_VERSION-x64-Setup.msi"
          Invoke-WebRequest -OutFile $msi -Uri "https://github.com/cppcheck-opensource/cppcheck/releases/download/$env:CPPCHECK_VERSION/cppcheck-$env:CPPCHECK_VERSION-x64-Setup.msi"
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:CPPCHECK_SHA256) { throw "cppcheck installer checksum mismatch" }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "cppcheck install failed with exit code $($install.ExitCode)" }
          & 'C:\Program Files\Cppcheck\cppcheck.exe' --version
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Cppcheck'

      # No msvc-dev-cmd step on purpose: `just configure` must find MSVC by
      # itself (tools/dev.py loads vcvarsall via vswhere), exactly as on a
      # developer's machine.
      - run: just setup

      - if: contains(matrix.checks, 'main')
        run: just doctor

      - name: Conan cache key
        id: conan-key
        run: |
          $key = uv run python tools/dev.py conan-cache-key ${{ matrix.conan-preset }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-key.outputs.key }}

      - id: deps
        run: just deps ${{ matrix.conan-preset }}

      - name: Trim Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: uv run python tools/dev.py conan-cache-trim ${{ matrix.conan-preset }}

      - name: Save Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-key.outputs.key }}

      - if: contains(matrix.checks, 'main')
        run: just build
      - if: contains(matrix.checks, 'main')
        env:
          TAZ_DAEMON: daemon/build/windows-debug/tazd.exe
        run: just test
      - if: contains(matrix.checks, 'main')
        run: just lint

      - if: contains(matrix.checks, 'main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taz-windows-x64-debug
          path: daemon/build/windows-debug/tazd.exe

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'asan') }}
        run: just test-c windows-asan

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'analyze') }}
        run: just build windows-analyze

      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just build windows-release

      - id: release-test-c
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just test-c windows-release

      - id: release-test-py
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just test-py --daemon daemon/build/windows-release/tazd.exe

      - id: release-verify
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && contains(matrix.checks, 'release') }}
        run: just verify-static windows-release

      # Only a binary that passed every check above is published.
      - id: release-bundle
        if: ${{ !cancelled() && steps.release-test-c.outcome == 'success' && steps.release-test-py.outcome == 'success' && steps.release-verify.outcome == 'success' }}
        run: just release-bundle windows-release

      - if: ${{ !cancelled() && steps.release-bundle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taz-windows-x64
          path: out/release/taz-windows-x64
