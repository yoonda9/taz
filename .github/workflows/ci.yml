name: CI

# Runs on every branch push (checks appear on PRs via the head commit) and on
# demand. No separate pull_request trigger, which would double-run same-repo PRs.
#
# Every step is a `just` recipe, so a red job reproduces locally with the same
# command. The matrix jobs each select one CMake preset (daemon/CMakePresets.json).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  linux:
    name: Linux (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # hatch-vcs derives the client version from tags

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system tools not managed by mise
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}
          restore-keys: conan-${{ runner.os }}-

      - run: just setup
      - run: just doctor
      - run: just build
      - run: just test
      - run: just lint

      - uses: actions/upload-artifact@v4
        with:
          name: tazer-linux-x64-debug
          path: daemon/build/linux-debug/tazer

  linux-checks:
    name: Linux ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: asan
            run: just test-c linux-asan
          - check: tsan
            run: just test-c linux-tsan
          - check: valgrind
            packages: valgrind
            run: just test-valgrind
          - check: analyze
            run: just build linux-analyze
          - check: clang
            packages: clang
            run: just test-c linux-clang-debug
          - check: coverage
            run: just coverage
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system tools not managed by mise
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.check }}-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}
          restore-keys: conan-${{ runner.os }}-

      - run: just setup
      - run: ${{ matrix.run }}

      - uses: actions/upload-artifact@v4
        if: matrix.check == 'coverage'
        with:
          name: coverage-report
          path: out/coverage

  windows:
    name: Windows (build, test, lint)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install system tools not managed by mise
        run: |
          choco install cppcheck --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Cppcheck'

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-msvc-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}
          restore-keys: conan-${{ runner.os }}-

      # No msvc-dev-cmd step on purpose: `just configure` must find MSVC by
      # itself (tools/dev.py loads vcvarsall via vswhere), exactly as on a
      # developer's machine.
      - run: just setup
      - run: just doctor
      - run: just build
      - run: just test
      - run: just lint

      - uses: actions/upload-artifact@v4
        with:
          name: tazer-windows-x64-debug
          path: daemon/build/windows-debug/tazer.exe

  windows-checks:
    name: Windows ${{ matrix.check }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: asan
            run: just test-c windows-asan
          - check: analyze
            run: just build windows-analyze
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pinned tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-msvc-${{ hashFiles('daemon/conanfile.py', 'daemon/profiles/*') }}
          restore-keys: conan-${{ runner.os }}-

      - run: just setup
      - run: ${{ matrix.run }}
