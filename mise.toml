# Tool pins for the TAZ repo. `mise install` is the single bootstrap step.
#
# Split of responsibilities:
#   mise      -> tool versions and environment (this file). No tasks live here.
#   justfile  -> every developer/CI task (`just --list`).
#   uv        -> Python environments and Python-ecosystem tools (ruff, mypy,
#                clang-format/clang-tidy wheels, protoc via grpcio-tools,
#                conan), locked with their dependencies in uv.lock.
#
# Every version is exact and bumped by hand (see "Pinned versions" in
# AGENTS.md); a partial version such as "22" would resolve differently on
# each machine and in CI.
#
# Not provided by mise (checked by `just doctor`): a system C compiler
# (GCC/Clang on Linux, MSVC + "C++ Clang tools for Windows" on Windows) and,
# on Windows, cppcheck.

[tools]
uv = "0.12.19"
prek = "0.3.13"
just = "1.58.0"
cmake = "4.4.3"
ninja = "1.13.2"
buf = "1.73.0"
node = "22.23.3"
"npm:prettier" = "3.9.9"
# cppcheck publishes release binaries for Windows only, and distro packages
# lag (Ubuntu 24.04 has 2.13). On Linux and macOS, mise installs conda-forge's
# build without needing conda. The install is ~340 MB because it carries its
# own Python, and only cppcheck is put on PATH. Its dependencies resolve at
# install time, so only cppcheck's version is pinned.
#
# Windows uses the official installer instead: conda-forge's Windows build
# looks for its cfg files under the build machine's path and cannot find
# them. This version is also the one Windows CI installs (ci.yml,
# CPPCHECK_VERSION), and `just doctor` fails when the cppcheck on PATH differs.
"conda:cppcheck" = { version = "2.22.0", os = ["linux", "macos"] }

[env]
# Keep the uv project venv in a predictable location so `just` recipes behave
# the same locally and in CI.
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
