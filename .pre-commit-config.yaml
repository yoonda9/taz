# Lint gate run before `git push` via prek. Install with:
#   just setup            (or: prek install --hook-type pre-push)
#
# Every check is a `just` recipe, so a failure here reproduces with the same
# command locally and in CI. Run `just lint` at any time.
exclude: |
  (?x)^(
    daemon/third_party/|
    daemon/CMake/cmake-conan/|
    daemon/generated/|
    c3/src/tazer/v1/|
    \.venv/
  )

default_stages: [pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: just-lint
        name: just lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
